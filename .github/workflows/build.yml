name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Mod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Check build output
        run: |
          if [ ! -f "build/libs/abcdlogin.jar" ]; then
            echo "❌ Build failed: abcdlogin.jar not found"
            exit 1
          fi
          echo "✅ Build successful: abcdlogin.jar created"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: abcdlogin-jar
          path: build/libs/abcdlogin.jar
          retention-days: 30

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: abcdlogin-jar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: abcdlogin.jar
          generate_release_notes: true
          draft: false
          prerelease: false
          name: Release ${{ github.ref_name }}
